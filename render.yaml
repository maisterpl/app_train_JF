# Static files only. No application server, database, disk or secrets.
# Creating/deploying the service requires the owner's explicit action.
services:
  - type: web
    name: sila-na-trase
    runtime: static
    buildCommand: test -f web/index.html
    staticPublishPath: ./web
    autoDeployTrigger: "off"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
